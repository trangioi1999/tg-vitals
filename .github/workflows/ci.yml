name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------- Tauri app (current) ----------
  core-tests:
    name: vitals-core tests (Linux, pure logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: cargo test -p vitals-core
        working-directory: app/src-tauri

  app:
    name: tg-vitals.app (macOS universal)
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Add the Intel Rust target (universal build)
        run: rustup target add x86_64-apple-darwin
      - name: Install frontend deps
        run: npm ci
        working-directory: app
      - name: Probe every macOS reader
        run: cargo run -p vitals-core --example probe
        working-directory: app/src-tauri
      - name: Probe the Intel slice under Rosetta
        run: cargo run --target x86_64-apple-darwin -p vitals-core --example probe
        working-directory: app/src-tauri
      - name: Test on a real Mac (samplers, icons, Trash)
        # One test at a time so a crash in system code names the test that caused it.
        run: cargo test -p vitals-core -- --include-ignored --nocapture --test-threads=1
        working-directory: app/src-tauri
      - name: Build universal tg-vitals.app (Apple silicon + Intel, ad-hoc signed)
        run: npm run tauri build -- --target universal-apple-darwin --bundles app
        working-directory: app
      - name: Zip
        run: |
          cd app/src-tauri/target/universal-apple-darwin/release/bundle/macos
          codesign --verify --verbose tg-vitals.app
          lipo -info tg-vitals.app/Contents/MacOS/tg-vitals
          lipo tg-vitals.app/Contents/MacOS/tg-vitals -verify_arch arm64 x86_64
          ditto -c -k --keepParent tg-vitals.app "$GITHUB_WORKSPACE/tg-vitals-macos-universal.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: tg-vitals-macos-universal
          path: tg-vitals-macos-universal.zip
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" tg-vitals-macos-universal.zip --title "$GITHUB_REF_NAME" --generate-notes

  # ---------- Legacy Swift app (reference until the Rust backend is verified) ----------
  swift:
    name: Swift (legacy)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
