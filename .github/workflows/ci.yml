name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  snapshots:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Render UI snapshots
        run: |
          .build/debug/TGVitals --snapshot "$PWD/snapshots" &
          PID=$!
          for i in $(seq 1 120); do kill -0 $PID 2>/dev/null || break; sleep 1; done
          kill $PID 2>/dev/null || true
          ls -la snapshots
      - name: Publish snapshots to the `ui-snapshots` branch
        if: github.event_name != 'pull_request'
        run: |
          cd snapshots
          git init -q -b ui-snapshots
          git add *.png
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "UI snapshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ui-snapshots
