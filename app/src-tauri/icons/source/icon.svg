<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d33"/>
      <stop offset="1" stop-color="#101114"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#32d74b"/>
      <stop offset="0.55" stop-color="#40c8e0"/>
      <stop offset="1" stop-color="#3a82f7"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse" x="12" y="12">
      <circle cx="20" cy="20" r="6" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#dots)"/>
    <rect x="100" y="100" width="824" height="2" fill="#ffffff" fill-opacity="0.18"/>
  </g>
  <polyline filter="url(#glow)" fill="none" stroke="url(#line)" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"
    points="196,540 360,540 420,420 500,700 580,330 640,540 828,540"/>
</svg>
