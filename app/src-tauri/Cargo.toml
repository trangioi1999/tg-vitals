[workspace]
members = [".", "core"]
resolver = "2"

[package]
name = "tg-vitals"
version = "0.3.1"
edition = "2021"
description = "Chỉ số sống của chiếc Mac"
publish = false

[lib]
name = "tg_vitals_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vitals-core = { path = "core" }
tauri = { version = "~2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Native menu-bar text styling; these AppKit bindings are already used by vitals-core.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
